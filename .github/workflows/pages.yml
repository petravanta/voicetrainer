name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-data.js
      - run: node test/dsp.test.js
      - run: node test/dims.test.js
      - run: node test/examples.test.js
      - run: node test/coach.test.js
      - run: node test/reading.test.js
      - run: node test/whisper.test.js
      - run: node test/sibex.test.js
      - run: node test/vowelmap.test.js
      - run: node test/focus.test.js
      - run: node test/follow.test.js
      - run: node test/embody.test.js
      - run: node test/wordvowels.test.js
      - run: node test/sing.test.js
      - run: node test/singread.test.js
      - run: node test/singfollow.test.js
      - run: node test/rigor.test.js
      - run: node test/scale.test.js
      - run: node test/heldnotes.test.js
      - run: node test/readres.test.js
      - run: node test/miccheck.test.js
      - run: node test/readcheck.test.js
      - run: node test/missed.test.js
      - run: node test/heardwords.test.js
      - run: node test/refread.test.js
      - run: node test/refclips.test.js
      - run: node test/tvy.test.js
      - run: node test/sustain.test.js
      - run: node test/natural.test.js
      - run: node test/formants.test.js
      - run: node test/cue.test.js
      - run: node test/align.test.js
      - run: node test/build.test.js
      - run: node test/h1.test.js
      - run: node test/mine.test.js
      - run: node build.js
      - run: mkdir -p site && cp dist/VoiceTrainer.html site/index.html && cp dist/version.json site/ && cp pwa/* site/ && cp -r refclips site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
